# Проверки кодом. Идут до Методиста; провал Репетитор правит сразу, это не круг правки.
# Схема — модель CodeChecks в specs/main.tsp; генерация Методички проверяет файл по ней.
# Запретные слова: этот список плюс все слова из строк _Avoid_ глоссария (их добавляет генерация).

# (1) Разделы Шаблона Конспекта, в этом порядке.
sections:
  - Коротко
  - Главное
  - Примеры
  - Частые ошибки
  - Связанные темы
  - Источники

# (2) Предложение на русском — не длиннее стольких слов. Примеры на изучаемом языке не считаем.
maxSentenceWords: 20

# (3) Канцелярит. Слово ловится в любом регистре, как отдельное слово или фраза.
forbiddenWords:
  - осуществлять
  - осуществляет
  - осуществляется
  - данный
  - данная
  - данное
  - данного
  - данной
  - данном
  - являться
  - является
  - являются
  - в рамках
  - производить
  - производится
  - в целях
  - вышеуказанный
  - вышеуказанные
  - посредством
  - в соответствии с
  - надлежащий
  - надлежащим

# (4) Каждая метка источника указывает на Исходник этой Обработки.
checkSourceLabels: true
