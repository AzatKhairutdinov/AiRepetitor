# One toolchain for developers, git hooks and CI.
min_version = "2026.10.9"

[tools]
node = "26"
pnpm = "12.23.0"
rumdl = "0.3.5"
typos = "1.52.2"
lychee = "0.24.2"
actionlint = "1.7.12"
rust = { version = "1.100.0", components = "rustfmt,clippy" }
# agnix: no Intel-macOS build, so compile on macOS; use the prebuilt binary on Linux/CI (saves ~5 min cold).
"cargo:agnix-cli" = { version = "0.61.0", os = ["macos"] }
"github:agent-sh/agnix" = { version = "0.61.0", os = [
  "linux",
], asset_pattern = "agnix-x86_64-unknown-linux-gnu.tar.gz" }
betterleaks = "1.10.1"
osv-scanner = "2.7.1"

[tasks.setup]
description = "Install dependencies and git hooks"
run = ["pnpm install --frozen-lockfile", "git config core.hooksPath .githooks"]

# Tier 1: fast, runs on pre-commit (no network)
[tasks."check:fast"]
description = "Fast checks (pre-commit)"
run = [
  "rumdl check .",
  "typos",
  "actionlint",
  "agnix --strict .",
  "betterleaks git . --no-banner",
  "pnpm exec oxlint --no-error-on-unmatched-pattern .",
  "pnpm exec oxfmt --check .",
]

# Tier 2/3: full set, runs on pre-push and in CI
[tasks.check]
description = "Everything CI runs"
depends = ["check:fast"]
run = [
  "pnpm exec tsc -b",
  "pnpm exec tsc -p apps/api",
  "pnpm exec tsc -p apps/web",
  "pnpm nx run-many -t build",
  "pnpm exec knip",
  "pnpm exec vitest run --passWithNoTests",
  "bash scripts/gen-check.sh",
  "lychee --config lychee.toml --no-progress '**/*.md'",
  "cargo fmt --manifest-path apps/worker/Cargo.toml --check",
  "cargo clippy --manifest-path apps/worker/Cargo.toml --all-targets --locked -- -D warnings",
  "cargo test --manifest-path apps/worker/Cargo.toml --locked",
]

[tasks.fix]
description = "Apply autofixes"
run = ["rumdl check --fix .", "typos -w", "pnpm exec oxlint --fix .", "pnpm exec oxfmt ."]

[tasks.generate]
description = "Regenerate contract code from TypeSpec and the embedded Playbook"
run = [
  "pnpm nx run contract:generate",
  "node scripts/gen-playbook.ts",
  "pnpm exec oxfmt apps/api/src/playbook.generated.ts",
]

# Slow, network-bound: known-vulnerability scan of the lockfile (runs on a schedule and on lockfile changes)
[tasks.security]
description = "Scan dependencies for known vulnerabilities (OSV)"
run = "osv-scanner scan source -L pnpm-lock.yaml"

# --- Local development -------------------------------------------------------
[tasks."dev:setup"]
description = "Create local env file and apply local D1 migrations (idempotent)"
run = "bash scripts/dev-setup.sh"

[tasks.dev]
description = "Run the API (:8787) and web app (:5173) with hot reload"
depends = ["dev:setup"]
run = "pnpm nx run-many -t dev --parallel=2"

[tasks.worker]
description = "Run the extraction worker against the local API"
run = "bash apps/worker/scripts/dev.sh"

[tasks."worker:install"]
description = "Install the worker as a launchd agent (macOS)"
run = "bash apps/worker/scripts/install-launchd.sh"

[tasks."team:grant"]
description = "Give an account the Team role: mise run team:grant <email>"
run = "bash scripts/team-grant.sh"

[tasks."db:generate"]
description = "Generate a SQL migration from apps/api/src/db/schema.ts"
run = "pnpm --filter @airepetitor/api exec drizzle-kit generate"

[tasks."db:migrate"]
description = "Apply migrations to the local D1 database"
run = "pnpm --filter @airepetitor/api exec wrangler d1 migrations apply DB --local"

[tasks."db:reset"]
description = "Delete the local D1 state and re-apply migrations"
run = ["rm -rf apps/api/.wrangler/state", "mise run db:migrate"]

[tasks."db:auth-schema"]
description = "Regenerate Better Auth tables (then run db:generate)"
dir = "apps/api"
run = "pnpm dlx auth@1.7.27 generate --config src/auth.cli.ts --output src/db/auth-schema.ts -y"
