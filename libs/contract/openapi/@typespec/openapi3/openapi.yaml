openapi: 3.0.0
info:
  title: AiRepetitor API
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /languages:
    get:
      operationId: listLanguages
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageList'
  /materials/{materialId}:
    get:
      operationId: Materials_getMaterial
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /materials/{materialId}/retry:
    post:
      operationId: Materials_retryMaterial
      description: |-
        «Повторить» for a Material in «ошибка»: it goes back to the Profile queue and goes on from
        the failed step. When no Source was read, the failed Sources are extracted again.
        409 when the Material is not in «ошибка».
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /materials/{materialId}/uploaded:
    post:
      operationId: Materials_confirmUpload
      description: 'Called after every PUT finished: checks the files are in storage.'
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /profiles:
    get:
      operationId: Profiles_listProfiles
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
    post:
      operationId: Profiles_createProfile
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
  /profiles/{profileId}:
    get:
      operationId: Profiles_getProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /profiles/{profileId}/materials:
    get:
      operationId: ProfileMaterials_listMaterials
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    post:
      operationId: ProfileMaterials_createMaterial
      description: Registers a Material and its Sources and returns a write link per file.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedMaterial'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaterialRequest'
  /profiles/{profileId}/topics:
    get:
      operationId: listTopics
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /sources/{sourceId}/retry:
    post:
      operationId: retrySource
      description: |-
        «Повторить» for a Source in «ошибка» while its Material is in «ошибка»: the Source is extracted
        again and Processing goes on; Sources already read are not extracted again.
        Returns the Material; 409 when the Source or its Material is not in «ошибка».
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /sources/{sourceId}/text:
    get:
      operationId: getSourceText
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceText'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /team/checks:
    get:
      operationId: teamGetChecks
      description: The Code Checks of the Playbook edition this API was built with.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeChecks'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /team/flows:
    get:
      operationId: teamListFlows
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowList'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /topics/{topicId}:
    get:
      operationId: getTopic
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /worker/claim:
    post:
      operationId: Worker_claimJob
      description: Leases the next job; 204 when there is none.
      parameters:
        - name: x-worker-protocol
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerJob'
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '426':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeRequiredError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimJobRequest'
  /worker/jobs/{jobId}/complete:
    post:
      operationId: Worker_completeJob
      description: Reports the result; 409 when the lease was lost to a newer attempt.
      parameters:
        - name: x-worker-protocol
          in: header
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '426':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeRequiredError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteJobRequest'
components:
  schemas:
    BadRequestError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ClaimJobRequest:
      type: object
      required:
        - kinds
      properties:
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/SourceKind'
          description: Source kinds this worker can extract; a worker without a model key leaves out images and media.
    CodeChecks:
      type: object
      required:
        - sections
        - maxSentenceWords
        - forbiddenWords
        - checkSourceLabels
      properties:
        sections:
          type: array
          items:
            type: string
          description: Template sections (level-2 headings), in order.
        maxSentenceWords:
          type: integer
          format: int32
          description: A Russian sentence may have at most this many words; examples in the studied language do not count.
        forbiddenWords:
          type: array
          items:
            type: string
          description: Bureaucratese and every glossary _Avoid_ word (the generator adds the latter).
        checkSourceLabels:
          type: boolean
          description: Every source label must point at a Source of this Processing.
      description: Code Checks of the Playbook (content/checks.yaml), validated by this model at generation.
    CompleteJobRequest:
      type: object
      required:
        - attempt
        - outcome
      properties:
        attempt:
          type: integer
          format: int32
        outcome:
          $ref: '#/components/schemas/JobOutcome'
        method:
          type: string
          description: 'Success: how the text was extracted, e.g. xberg, pandoc, whisper, vision.'
        audioSaved:
          type: boolean
          description: 'Success, audio and video: the audio track was saved through `writeAudio`.'
        code:
          type: string
          description: 'Failure: a machine-readable code.'
        reason:
          type: string
          description: 'Failure: the reason in Russian, shown to the Learner.'
        usage:
          type: array
          items:
            $ref: '#/components/schemas/ModelUsage'
          description: Model calls of this attempt, on success and on failure alike.
    ConflictError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    CreateMaterialRequest:
      type: object
      required:
        - sources
      properties:
        title:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/NewSource'
    CreateProfileRequest:
      type: object
      required:
        - language
      properties:
        language:
          $ref: '#/components/schemas/LanguageCode'
    CreatedMaterial:
      type: object
      required:
        - material
        - uploads
      properties:
        material:
          $ref: '#/components/schemas/Material'
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/SourceUpload'
    Digest:
      type: object
      required:
        - version
        - markdown
        - createdAt
      properties:
        version:
          type: integer
          format: int32
        markdown:
          type: string
          description: Markdown; `[[source:<sourceId>]]` marks a reference to a Source text.
        createdAt:
          type: string
          format: date-time
      description: The latest Digest version; the Learner never sees older ones.
    DigestSource:
      type: object
      required:
        - sourceId
        - fileName
        - materialId
      properties:
        sourceId:
          type: string
        fileName:
          type: string
        materialId:
          type: string
      description: A Source a Digest may cite.
    FlowList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlowSummary'
    FlowSummary:
      type: object
      required:
        - id
        - title
        - version
      properties:
        id:
          type: string
          description: Machine id in libs/flows.
        title:
          type: string
        version:
          type: integer
          format: int32
      description: One Processing scenario; the diagram itself is drawn from libs/flows.
    ForbiddenError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    JobOutcome:
      type: string
      enum:
        - success
        - failure
    Language:
      type: object
      required:
        - code
        - name
      properties:
        code:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
          description: Russian name, also the name of a Profile for this language.
    LanguageCode:
      type: string
      enum:
        - en
        - es
        - fr
        - de
        - it
        - pt
        - zh
        - ja
        - ko
        - tr
        - sr
      description: ISO 639-1 code of a language a Learner can study.
    LanguageList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Language'
    Material:
      type: object
      required:
        - id
        - profileId
        - status
        - createdAt
        - sources
        - topics
      properties:
        id:
          type: string
        profileId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/MaterialStatus'
        createdAt:
          type: string
          format: date-time
        errorReason:
          type: string
          description: Russian reason for the Learner, set when status is failed.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/MaterialTopic'
    MaterialList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialSummary'
    MaterialStatus:
      type: string
      enum:
        - uploading
        - uploaded
        - queued
        - processing
        - topicsReady
        - noTopics
        - failed
      description: uploading → uploaded → queued → processing → topicsReady | noTopics | failed
    MaterialSummary:
      type: object
      required:
        - id
        - profileId
        - status
        - createdAt
      properties:
        id:
          type: string
        profileId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/MaterialStatus'
        createdAt:
          type: string
          format: date-time
      description: Everything the Learner sent the Tutor in one upload.
    MaterialTopic:
      type: object
      required:
        - id
        - title
        - mark
      properties:
        id:
          type: string
        title:
          type: string
        mark:
          $ref: '#/components/schemas/TopicMark'
      description: A Topic this Material touched.
    ModelUsage:
      type: object
      required:
        - model
      properties:
        model:
          type: string
          description: Model id as sent to the provider.
        inputTokens:
          type: integer
          format: int64
          description: Token-priced models (vision).
        outputTokens:
          type: integer
          format: int64
        audioMinutes:
          type: number
          format: double
          description: 'Minute-priced models (speech recognition): minutes of audio transcribed.'
      description: What one model spent on a job; the API prices it and adds the cost to the Processing.
    NewSource:
      type: object
      required:
        - fileName
        - mimeType
        - size
      properties:
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        durationSeconds:
          type: number
          format: double
          description: Seconds, when the browser could read it from the media metadata.
    NotFoundError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Profile:
      type: object
      required:
        - id
        - language
        - name
        - createdAt
      properties:
        id:
          type: string
        language:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
          description: Named after the language, in Russian.
        createdAt:
          type: string
          format: date-time
      description: One Learner studying one language.
    ProfileList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
    Source:
      type: object
      required:
        - id
        - fileName
        - kind
        - mimeType
        - size
        - status
      properties:
        id:
          type: string
        fileName:
          type: string
        kind:
          $ref: '#/components/schemas/SourceKind'
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        durationSeconds:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/SourceStatus'
        errorReason:
          type: string
          description: Russian reason for the Learner, set when status is failed.
      description: One file the Learner sent within a Material.
    SourceKind:
      type: string
      enum:
        - pdf
        - image
        - document
        - audio
        - video
    SourceStatus:
      type: string
      enum:
        - uploading
        - uploaded
        - queued
        - extracting
        - extracted
        - failed
      description: uploading → uploaded → queued → extracting → extracted | failed
    SourceText:
      type: object
      required:
        - sourceId
        - fileName
        - materialId
        - profileId
        - markdown
      properties:
        sourceId:
          type: string
        fileName:
          type: string
        materialId:
          type: string
        profileId:
          type: string
        markdown:
          type: string
    SourceUpload:
      type: object
      required:
        - sourceId
        - url
        - headers
      properties:
        sourceId:
          type: string
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the PUT must carry.
      description: Where the browser PUTs one file.
    Topic:
      type: object
      required:
        - id
        - title
        - description
        - profileId
        - sources
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        profileId:
          type: string
        digest:
          $ref: '#/components/schemas/Digest'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DigestSource'
    TopicList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopicSummary'
    TopicMark:
      type: string
      enum:
        - new
        - extended
    TopicSummary:
      type: object
      required:
        - id
        - title
        - description
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
    UnauthorizedError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    UpgradeRequiredError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    WorkerJob:
      type: object
      required:
        - jobId
        - sourceId
        - kind
        - mimeType
        - fileName
        - size
        - attempt
        - leaseExpiresAt
        - readUrl
        - writeText
      properties:
        jobId:
          type: string
        sourceId:
          type: string
        kind:
          $ref: '#/components/schemas/SourceKind'
        mimeType:
          type: string
        fileName:
          type: string
        size:
          type: integer
          format: int64
        durationSeconds:
          type: number
          format: double
        attempt:
          type: integer
          format: int32
          description: Attempt number; send it back in `complete`.
        leaseExpiresAt:
          type: string
          format: date-time
        readUrl:
          type: string
          description: Signed GET of the original file.
        writeText:
          allOf:
            - $ref: '#/components/schemas/WriteLink'
          description: Where to PUT the Source text (Markdown).
        writeAudio:
          allOf:
            - $ref: '#/components/schemas/WriteLink'
          description: 'Audio and video only: where to PUT the extracted audio track (Opus in Ogg).'
        visionPrompt:
          type: string
          description: "PDF and images only: the vision model instruction from the Processing's Playbook edition."
      description: One Source to extract, leased to the worker until `leaseExpiresAt`.
    WriteLink:
      type: object
      required:
        - url
        - headers
      properties:
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the PUT must carry.
      description: A signed link to PUT one object.
