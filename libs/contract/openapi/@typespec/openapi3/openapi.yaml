openapi: 3.0.0
info:
  title: AiRepetitor API
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /languages:
    get:
      operationId: listLanguages
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageList'
  /profiles:
    get:
      operationId: Profiles_listProfiles
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
    post:
      operationId: Profiles_createProfile
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
  /profiles/{profileId}:
    get:
      operationId: Profiles_getProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
components:
  schemas:
    ConflictError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    CreateProfileRequest:
      type: object
      required:
        - language
      properties:
        language:
          $ref: '#/components/schemas/LanguageCode'
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Language:
      type: object
      required:
        - code
        - name
      properties:
        code:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
          description: Russian name, also the name of a Profile for this language.
    LanguageCode:
      type: string
      enum:
        - en
        - es
        - fr
        - de
        - it
        - pt
        - zh
        - ja
        - ko
        - tr
        - sr
      description: ISO 639-1 code of a language a Learner can study.
    LanguageList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Language'
    NotFoundError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Profile:
      type: object
      required:
        - id
        - language
        - name
        - createdAt
      properties:
        id:
          type: string
        language:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
          description: Named after the language, in Russian.
        createdAt:
          type: string
          format: date-time
      description: One Learner studying one language.
    ProfileList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
    UnauthorizedError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
